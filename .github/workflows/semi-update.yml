# Rebuilds this brand kit with the newest @semi/ui release every Monday; opens a pull request when the generated
# kit changes. Release afterwards with /semi-brand update (bump + tag). Generated by /semi-brand.
# One-time setup: Settings → Actions → General → Allow GitHub Actions to create and approve pull requests.
name: Semi update

on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: up
        name: Rebuild with the newest @semi/ui release
        run: |
          tag=$(git ls-remote --tags --refs https://github.com/hoanghuynh296/semi-nextjs-codebase.git 'v*' | sed 's#.*refs/tags/##' | sort -V | tail -1)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          npm pkg set "devDependencies.@semi/ui=github:hoanghuynh296/semi-nextjs-codebase#$tag"
          rm -f package-lock.json && npm install --no-audit --no-fund
          npx semi-brand build || true
          if git diff --quiet -I'"semiVersion"' -I'@semi/ui [0-9]' -- dist BRAND.md AGENTS.brand.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.up.outputs.changed == 'true'
        name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.up.outputs.tag }}
        run: |
          branch="semi-update/$TAG"
          if git ls-remote --exit-code origin "refs/heads/$branch" >/dev/null; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -A
          git commit -m "Rebuild with @semi/ui $TAG"
          git push origin "$branch"
          gh pr create --title "Semi $TAG: brand kit rebuilt" --body "The kit rebuilt with @semi/ui $TAG changes its generated files (colours, guideline or agent rules). Review the diff and the contrast table in BRAND.md, then release with /semi-brand update (bump + tag). Opened by the Semi update workflow."
